<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Explore temples from around the world with useful information about their location, dedication date, and size.">
    <meta name="author" content="Talasinga Tonga">

    <title>Temple Album</title>

    <link rel="stylesheet" href="styles/filtered-temples.css">
    <script src="scripts/filetred-temples.js" defer></script>
</head>

<body>

    <header>
        <div class="header-content">
            <h1>Temple Album</h1>

            <button id="menu-button"
                    aria-label="Open navigation menu"
                    aria-expanded="false"
                    aria-controls="navigation">
                ☰
            </button>
        </div>

        <nav id="navigation">
            <button type="button" data-filter="home">Home</button>
            <button type="button" data-filter="old">Old</button>
            <button type="button" data-filter="new">New</button>
            <button type="button" data-filter="large">Large</button>
            <button type="button" data-filter="small">Small</button>
        </nav>
    </header>

    <main>
        <h2>Temples Around the World</h2>

        <section id="temples-container" class="temples-grid">
            <!-- JavaScript dynamically creates temple cards here -->
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Talasinga Tonga</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>

</body>

</html>
