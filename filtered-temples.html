<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Explore a collection of temples from around the world with information about their location, dedication dates, and size.">
    <meta name="author" content="Talasinga Tonga">

    <title>Temple Album</title>

    <link rel="stylesheet" href="styles/filtered-temples.css">
    <script src="scripts/filtered-temples.js" defer></script>
</head>

<body>

    <header>
        <div class="header-content">
            <p class="site-title">Temple Album</p>

            <button id="menu-button"
                    aria-label="Open navigation menu"
                    aria-expanded="false"
                    aria-controls="navigation">
                ☰
            </button>
        </div>

        <nav id="navigation">
            <a href="#" data-filter="home">Home</a>
            <a href="#" data-filter="old">Old</a>
            <a href="#" data-filter="new">New</a>
            <a href="#" data-filter="large">Large</a>
            <a href="#" data-filter="small">Small</a>
        </nav>
    </header>

    <main>
        <h1>Temple Album</h1>

        <h2>Temples Around the World</h2>

        <section id="temples-container" class="temples-grid">
            <!-- Temple cards are created by JavaScript -->
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Talasinga Tonga</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>

</body>
</html>
